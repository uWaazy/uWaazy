name: keep-warm

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Warm the README card
        run: |
          curl -fsS -m 25 -o /dev/null -w "pt %{http_code} %{time_total}s\n" "https://uwaazy.vercel.app/api/readme?lang=pt" || true
          curl -fsS -m 25 -o /dev/null -w "en %{http_code} %{time_total}s\n" "https://uwaazy.vercel.app/api/readme?lang=en" || true
